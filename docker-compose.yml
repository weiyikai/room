version: '3.8'
services:
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=256m
    restart: always
    networks:
      - app-network
    # 健康检查：等待Nacos完全启动
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    # 👇 手动指定镜像名（简洁、好记、离线打包专用）
    image: room-backend:latest
    container_name: room
    ports:
      - "8888:8888"
    restart: always
    # 🔥 修复3：等待Nacos健康启动后再启动
    depends_on:
      nacos:
        condition: service_healthy
    # 🔥 修复4：挂载环境变量文件（核心！Nacos配置全靠它）
    env_file:
      - .env
    volumes:
      - ./backend/room/media:/app/media
      - ./backend/room/data:/app/data
      # 🔥 新增：静态文件挂载（Admin样式）
      - ./backend/room/static_collect:/app/static_collect
    working_dir: /app
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      # 🔥 关键：把 Django 收集的静态文件挂载给 Nginx
      - ./backend/room/static_collect:/usr/share/nginx/static
      - ./backend/room/media:/usr/share/nginx/media
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge